<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Sign in or create your AutoParts Pro account to access orders, wishlists, and more."/>
  <title>Login / Register – AutoParts Pro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>

<div id="page-loader">
  <div class="loader-inner"><div class="loader-ring"></div><div class="loader-logo">AutoParts Pro</div></div>
</div>

<div class="auth-wrap">
  <div class="auth-card" data-aos="fade-up">
    <!-- Logo -->
    <div class="auth-logo">
      <div style="margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:8px">
        <div class="brand-icon"><i class="fas fa-bolt"></i></div>
        <div class="auth-logo-txt">Auto<span class="red">Parts Pro</span></div>
      </div>
    </div>

    <!-- Title -->
    <h2 class="auth-title" id="auth-title">Welcome Back</h2>
    <p class="auth-subtitle" id="auth-subtitle">Sign in to your account</p>

    <!-- Tabs -->
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="showTab('login')">Login</div>
      <div class="auth-tab" id="tab-register" onclick="showTab('register')">Register</div>
    </div>

    <!-- LOGIN FORM -->
    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-lbl" for="login-email">Email Address</label>
        <div style="position:relative">
          <i class="fas fa-envelope" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
          <input class="form-ctrl" type="email" id="login-email" placeholder="you@example.com" style="padding-left:42px" required/>
        </div>
        <div class="error-msg" id="login-email-err" style="display:none"></div>
      </div>
      <div class="form-group">
        <label class="form-lbl" for="login-password">Password</label>
        <div class="pw-wrap">
          <i class="fas fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
          <input class="form-ctrl" type="password" id="login-password" placeholder="Enter password" style="padding-left:42px;padding-right:44px" required/>
          <button type="button" class="pw-toggle" onclick="togglePw('login-password', this)"><i class="fas fa-eye"></i></button>
        </div>
        <div class="error-msg" id="login-pw-err" style="display:none"></div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.85rem;color:var(--text-muted)">
          <input type="checkbox" style="accent-color:var(--accent)"> Remember me
        </label>
        <a href="#" style="font-size:0.84rem;color:var(--accent)">Forgot password?</a>
      </div>
      <div class="error-msg" id="login-general-err" style="display:none"></div>
      <button type="submit" class="btn-accent btn-full" style="margin-top:4px">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>

      <div class="divider"><span>or continue with</span></div>
      <button type="button" class="social-auth-btn" onclick="showToast('Google login coming soon!','info')">
        <i class="fab fa-google" style="color:#ea4335"></i> Continue with Google
      </button>
      <button type="button" class="social-auth-btn" onclick="showToast('Facebook login coming soon!','info')">
        <i class="fab fa-facebook" style="color:#1877f2"></i> Continue with Facebook
      </button>

      <p style="text-align:center;margin-top:20px;font-size:0.85rem;color:var(--text-muted)">
        Don't have an account?
        <a href="#" onclick="showTab('register')" style="color:var(--accent);font-weight:600">Register</a>
      </p>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" style="display:none" novalidate>
      <div class="row gy-2">
        <div class="col-12 form-group">
          <label class="form-lbl" for="reg-name">Full Name</label>
          <input class="form-ctrl" type="text" id="reg-name" placeholder="John Doe" required/>
          <div class="error-msg" id="reg-name-err" style="display:none"></div>
        </div>
        <div class="col-12 form-group">
          <label class="form-lbl" for="reg-email">Email Address</label>
          <input class="form-ctrl" type="email" id="reg-email" placeholder="you@example.com" required/>
          <div class="error-msg" id="reg-email-err" style="display:none"></div>
        </div>
        <div class="col-12 form-group">
          <label class="form-lbl" for="reg-phone">Phone (Optional)</label>
          <input class="form-ctrl" type="tel" id="reg-phone" placeholder="10-digit mobile number"/>
          <div class="error-msg" id="reg-phone-err" style="display:none"></div>
        </div>
        <div class="col-12 form-group">
          <label class="form-lbl" for="reg-password">Password</label>
          <div class="pw-wrap">
            <input class="form-ctrl" type="password" id="reg-password" placeholder="Min 6 characters" style="padding-right:44px" required/>
            <button type="button" class="pw-toggle" onclick="togglePw('reg-password', this)"><i class="fas fa-eye"></i></button>
          </div>
          <div class="error-msg" id="reg-pw-err" style="display:none"></div>
        </div>
        <div class="col-12 form-group">
          <label class="form-lbl" for="reg-confirm">Confirm Password</label>
          <div class="pw-wrap">
            <input class="form-ctrl" type="password" id="reg-confirm" placeholder="Re-enter password" style="padding-right:44px" required/>
            <button type="button" class="pw-toggle" onclick="togglePw('reg-confirm', this)"><i class="fas fa-eye"></i></button>
          </div>
          <div class="error-msg" id="reg-confirm-err" style="display:none"></div>
        </div>
      </div>
      <div style="margin:14px 0;font-size:0.8rem;color:var(--text-muted)">
        By registering you agree to our
        <a href="#" style="color:var(--accent)">Terms & Conditions</a> and
        <a href="#" style="color:var(--accent)">Privacy Policy</a>.
      </div>
      <button type="submit" class="btn-accent btn-full">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
      <p style="text-align:center;margin-top:18px;font-size:0.85rem;color:var(--text-muted)">
        Already have an account?
        <a href="#" onclick="showTab('login')" style="color:var(--accent);font-weight:600">Sign In</a>
      </p>
    </form>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
